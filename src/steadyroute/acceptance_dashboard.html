<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SteadyRoute 状态契约验收</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--panel:#111d30;--line:#263750;--text:#e7eef8;--muted:#93a4bb;--accent:#67e8b4;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:32px 20px 64px}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:28px 0 12px}.meta{color:var(--muted)}.flow{display:flex;gap:8px;align-items:center;overflow:auto;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.step{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#172945;color:var(--accent)}.arrow{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card strong{display:block;font-size:15px;margin-bottom:8px}.code{color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.reach{display:inline-block;margin:8px 0;padding:3px 8px;border-radius:999px;background:#24334b;color:var(--warn);font-size:11px}.facts{color:var(--muted);font-size:12px;word-break:break-word}.values{display:flex;gap:12px}.value{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.error{color:var(--warn)}@media(max-width:600px){.shell{padding:20px 12px}.values{display:block}.value{margin-bottom:12px}}
  </style>
</head>
<body><main class="shell">
  <h1>状态契约独立验收看板</h1>
  <div class="meta" id="meta">只读加载固定 fixture；不会探测、读取连接或切换线路。</div>
  <section><h2>代理组转换</h2><div id="group-flows"></div></section>
  <section><h2>代理组固定样例</h2><div class="grid" id="groups"></div></section>
  <section><h2>节点生命周期转换</h2><div id="node-flows"></div></section>
  <section><h2>节点固定样例</h2><div class="grid" id="nodes"></div></section>
  <section><h2>边界值样例</h2><div class="values" id="values"></div></section>
</main><script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flow=(items,arrows=true)=>`<div class="flow">${items.map((x,i)=>`${i&&arrows?'<span class="arrow">→</span>':''}<span class="step">${esc(x)}</span>`).join('')}</div>`;
const card=c=>`<article class="card"><strong>${esc(c.scenario)}</strong><div class="code">${esc(c.expected.code||c.expected.lifecycle)}</div><div>${esc(c.expected.title)}</div><span class="reach">${esc(c.reachability)}</span><div class="facts">输入：${esc(JSON.stringify(c.facts))}</div></article>`;
fetch('/acceptance/fixtures',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
  document.querySelector('#meta').textContent=`schema v${d.schema_version} · 固定时间 ${d.generated_at} · ${d.group_scenarios.length+d.node_scenarios.length+d.value_scenarios.length} 个样例 · 只读`;
  document.querySelector('#group-flows').innerHTML=flow(d.transitions.group_normal)+flow(d.transitions.group_failure)+flow(d.transitions.group_exception_branches,false);
  document.querySelector('#node-flows').innerHTML=flow(d.transitions.node)+flow(d.transitions.node_retirement);
  document.querySelector('#groups').innerHTML=d.group_scenarios.map(card).join('');
  document.querySelector('#nodes').innerHTML=d.node_scenarios.map(card).join('');
  document.querySelector('#values').innerHTML=d.value_scenarios.map(c=>`<article class="value"><strong>${esc(c.scenario)}</strong><span class="reach">${esc(c.reachability)}</span><pre>${esc(JSON.stringify(c.expected,null,2))}</pre></article>`).join('');
}).catch(e=>document.querySelector('#meta').innerHTML=`<span class="error">fixture 加载失败：${esc(e.message)}</span>`);
</script></body></html>
