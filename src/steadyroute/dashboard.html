<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稳航 SteadyRoute</title>
<style>
/* ------------------------------------------------------------------
   Tokens. Light is the base; dark follows the system or data-theme.
   Status colours (good / warn / bad) are only used for status.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --surface: #ffffff;
  --raised: #f7f9fb;
  --inset: #eef1f5;
  --line: #e2e7ee;
  --line-strong: #cdd5df;
  --text: #0f1722;
  --text-2: #364252;
  --muted: #677385;
  --accent: #0a7ca6;
  --accent-soft: #e3f2f8;
  --standby: #8a94a6;
  --good: #16804a;
  --good-soft: #e3f4ea;
  --warn: #a45f06;
  --warn-soft: #fbefdc;
  --bad: #c0343f;
  --bad-soft: #fbe6e8;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .05);
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0e13;
    --surface: #11161d;
    --raised: #151b23;
    --inset: #0d1218;
    --line: #1e2732;
    --line-strong: #2b3644;
    --text: #e7ecf2;
    --text-2: #b9c3cf;
    --muted: #7f8b9b;
    --accent: #4fc3e4;
    --accent-soft: #0f2831;
    --standby: #7e8a9b;
    --good: #4bc98b;
    --good-soft: #0f271b;
    --warn: #e7a93f;
    --warn-soft: #2b2010;
    --bad: #f06a74;
    --bad-soft: #2d1418;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 8px 24px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0e13;
  --surface: #11161d;
  --raised: #151b23;
  --inset: #0d1218;
  --line: #1e2732;
  --line-strong: #2b3644;
  --text: #e7ecf2;
  --text-2: #b9c3cf;
  --muted: #7f8b9b;
  --accent: #4fc3e4;
  --accent-soft: #0f2831;
  --standby: #7e8a9b;
  --good: #4bc98b;
  --good-soft: #0f271b;
  --warn: #e7a93f;
  --warn-soft: #2b2010;
  --bad: #f06a74;
  --bad-soft: #2d1418;
  --shadow: 0 1px 0 rgba(255, 255, 255, .02), 0 8px 24px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { width: min(1180px, 100%); margin: 0 auto; padding-inline: 20px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 22px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand svg { width: 26px; height: 26px; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.brand span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav a {
  padding: 7px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; font-size: 13.5px;
}
.nav a:hover { color: var(--text); background: var(--inset); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--text); background: var(--inset); font-weight: 600; }
.live { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.live-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px 5px 9px;
  border-radius: 999px; background: var(--good-soft); color: var(--good); font-weight: 600; font-size: 13px;
}
.live-chip[data-sev="warn"] { background: var(--warn-soft); color: var(--warn); }
.live-chip[data-sev="bad"] { background: var(--bad-soft); color: var(--bad); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; position: relative; }
.live-dot::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid currentColor; opacity: 0;
  animation: ping 2.4s ease-out infinite;
}
@keyframes ping { 0% { transform: scale(.5); opacity: .55; } 80%, 100% { transform: scale(1.4); opacity: 0; } }
.live-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

main.wrap { padding-block: 22px 56px; display: grid; gap: 18px; }

/* ---------- section heads ---------- */
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 15px; font-weight: 650; }
.section-head p { color: var(--muted); font-size: 12.5px; }
.segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--inset); border-radius: 9px; border: 1px solid var(--line); }
/* One selected style for every toggle group: tinted accent, visible in both themes, never glaring. */
.segmented button, .filter {
  border: 0; background: transparent; min-height: 30px; padding: 5px 12px; border-radius: 7px; color: var(--muted);
  font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.segmented button:hover, .filter:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
.segmented button[aria-pressed="true"], .filter[aria-pressed="true"] {
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
}
.filter .count {
  font-size: 11px; min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center;
  background: color-mix(in srgb, var(--text) 8%, transparent); color: inherit; font-weight: 600;
}
.filter[aria-pressed="true"] .count { background: color-mix(in srgb, var(--accent) 18%, transparent); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ---------- route cards ---------- */
.routes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.route { padding: 18px 18px 16px; display: grid; gap: 14px; min-width: 0; }
.route-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.route-title { display: grid; gap: 3px; min-width: 0; }
.region {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); letter-spacing: .04em;
}
.region i { width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
.route-title h2 { font-size: 15.5px; font-weight: 650; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px;
  font-weight: 600; white-space: nowrap; background: var(--accent-soft); color: var(--accent); max-width: 60%;
  overflow: hidden; text-overflow: ellipsis;
}
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.now { display: grid; gap: 4px; padding: 12px 14px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); }
.now-label { font-size: 11.5px; color: var(--muted); letter-spacing: .05em; }
.now-name { font-size: 19px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.now-standby { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.now-standby .dash { width: 14px; border-top: 2px dashed var(--standby); display: inline-block; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { padding: 10px 11px; border-radius: 10px; background: var(--inset); min-width: 0; display: grid; gap: 2px; align-content: start; border: 1px solid transparent; }
.m-label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.m-value { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.m-value small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.m-toggle { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; display: inline-flex; align-items: baseline; }
.m-toggle small { color: var(--accent) !important; text-decoration: underline; text-underline-offset: 3px; }
.metric.conn:has(.m-toggle:hover) { border-color: var(--line-strong); }
.metric.conn:has(.m-toggle[aria-expanded="true"]) { border-color: var(--accent); background: var(--accent-soft); }

.handover {
  display: grid; gap: 7px; padding: 10px 12px; border-radius: 11px;
  background: color-mix(in srgb, var(--good-soft) 70%, transparent); border: 1px dashed color-mix(in srgb, var(--good) 45%, transparent);
  font-size: 12.5px; color: var(--text-2);
}
.handover b { color: var(--text); font-weight: 600; }
.handover-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--good); font-size: 12.5px; }

/* ---------- chart ---------- */
.chart { display: grid; gap: 6px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { width: 14px; height: 0; border-top: 2px solid var(--accent); }
.legend .sw.standby { border-top: 2px dashed var(--standby); }
.legend .sw.fail { width: 8px; height: 8px; border: 0; border-radius: 2px; background: var(--bad); }
.legend .sw.switch-fail { width: 0; height: 11px; border-top: 0; border-left: 2px solid var(--bad); }
.legend .sw.switch-opt { width: 0; height: 11px; border-top: 0; border-left: 2px dashed var(--good); }
.chart-now { font-size: 12px; color: var(--muted); }
.chart-now b { font-size: 16px; color: var(--text); font-weight: 650; font-family: var(--mono); }
.plot { position: relative; height: 158px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); touch-action: pan-y; }
.plot { overflow: hidden; }
.plot > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.plot .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; }
.axis { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.grid { stroke: var(--line); stroke-width: 1; }
.flag { font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: var(--raised); stroke-width: 3px; }
.plot-tip {
  position: absolute; pointer-events: none; z-index: 3; min-width: 150px; padding: 8px 10px; border-radius: 9px;
  background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow); font-size: 12px; line-height: 1.5;
}
.plot-tip .t { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.plot-tip .row { display: flex; justify-content: space-between; gap: 12px; }
.plot-tip .row b { font-family: var(--mono); font-weight: 600; }
.reason { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
.reason .next { color: var(--muted); }

/* ---------- connections ---------- */
.conns { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.conns-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--inset); }
.split i { display: block; height: 100%; transition: width .6s ease; }
.split-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); }
.split-legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.split-legend em { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
.site-list { display: grid; gap: 2px; }
.site {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; align-items: center;
  padding: 7px 8px; border-radius: 8px; font-size: 12.5px;
}
.site:nth-child(odd) { background: var(--raised); }
.site-host { min-width: 0; display: grid; }
.site-host b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-host small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site .count { font-weight: 650; min-width: 34px; text-align: right; }
.site .since, .site .bytes { color: var(--muted); white-space: nowrap; font-size: 12px; }
.site .old { color: var(--text-2); }
.conns-note { font-size: 11.5px; color: var(--muted); }

/* ---------- summary strip ---------- */
.summary { display: grid; grid-template-columns: 1.5fr 1.3fr 1fr 1fr; }
.summary > div { padding: 15px 18px; border-left: 1px solid var(--line); min-width: 0; display: grid; gap: 4px; align-content: start; }
.summary > div:first-child { border-left: 0; }
.s-label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; letter-spacing: .03em; }
.s-value { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.s-value small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.s-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.stack { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--inset); margin-top: 4px; }
.stack i { display: block; height: 100%; }
.stack-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.stack-legend b { font-weight: 650; }

/* ---------- nodes ---------- */
.nodes-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.nodes-head h2 { font-size: 15px; font-weight: 650; }
.nodes-head p { font-size: 12.5px; color: var(--muted); }
.filters { display: inline-flex; gap: 2px; padding: 3px; background: var(--inset); border-radius: 9px; border: 1px solid var(--line); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--raised); }
th .th { display: inline-flex; align-items: center; gap: 4px; }
tbody tr:last-child td { border-bottom: 0; }
tr.group-row td {
  background: var(--inset); color: var(--text-2); font-size: 12px; padding: 7px 14px; text-align: left; font-weight: 600; letter-spacing: .03em;
}
tr.group-row td span { color: var(--muted); font-weight: 500; margin-left: 8px; letter-spacing: 0; }
tr.is-current td { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.nm { display: flex; align-items: center; gap: 10px; min-width: 300px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: 0 0 auto; }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.info { background: var(--standby); }
.nm-copy { display: grid; min-width: 0; }
.nm-copy b { font-weight: 550; overflow-wrap: anywhere; }
.nm-copy small { color: var(--muted); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 5px; margin-left: 4px; vertical-align: 1px; }
.tag.cur { background: var(--accent-soft); color: var(--accent); }
.tag.hot { background: var(--inset); color: var(--text-2); border: 1px dashed var(--line-strong); }
.avail { display: inline-flex; align-items: center; gap: 8px; }
.bar { width: 64px; height: 5px; border-radius: 999px; background: var(--inset); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }
.q { font-weight: 650; }
.q.warn { color: var(--warn); }
.q.bad { color: var(--bad); }
.state { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--good-soft); color: var(--good); font-weight: 600; }
.state.warn { background: var(--warn-soft); color: var(--warn); }
.state.bad { background: var(--bad-soft); color: var(--bad); }
.state.info { background: var(--inset); color: var(--text-2); }
.empty-row { padding: 26px; text-align: center; color: var(--muted); }

/* ---------- rules ---------- */
details.rules { padding: 0; }
details.rules > summary {
  list-style: none; cursor: pointer; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
details.rules > summary::-webkit-details-marker { display: none; }
details.rules > summary h2 { font-size: 15px; font-weight: 650; }
details.rules > summary .chev { color: var(--muted); font-size: 12.5px; }
details.rules[open] > summary { border-bottom: 1px solid var(--line); }
.rule-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rule { padding: 16px 18px; display: grid; gap: 8px; align-content: start; border-left: 1px solid var(--line); }
.rule:first-child { border-left: 0; }
.rule h3 { font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.rule h3 i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 12px; background: var(--inset); color: var(--text-2); }
.rule p { font-size: 12.5px; color: var(--text-2); line-height: 1.65; }
.rule ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.rule li { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; }
.rule li b { color: var(--text); font-weight: 600; white-space: nowrap; }
.rule a { font-size: 12px; }

footer.wrap { padding-block: 0 28px; color: var(--muted); font-size: 12px; text-align: center; }

/* ---------- tooltip ---------- */
.tip {
  width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
  font-size: 10.5px; line-height: 1; display: inline-grid; place-items: center; cursor: help; padding: 0; flex: 0 0 auto;
}
.tip:hover, .tip[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
#tip-pop {
  position: fixed; z-index: 50; width: min(300px, calc(100vw - 24px)); padding: 11px 13px; border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 12px 32px rgba(0,0,0,.18); font-size: 12.5px; line-height: 1.6;
}
#tip-pop h4 { margin: 0 0 4px; font-size: 13px; }
#tip-pop p { color: var(--text-2); }
#tip-pop .val { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); color: var(--text); }
#tip-pop a { display: inline-block; margin-top: 6px; font-size: 12px; }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .routes { grid-template-columns: 1fr; }
  .summary { grid-template-columns: 1fr 1fr; }
  .summary > div:nth-child(3) { border-left: 0; }
  .summary > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .rule-grid { grid-template-columns: 1fr 1fr; }
  .rule:nth-child(3) { border-left: 0; }
  .rule:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 720px) {
  .wrap { padding-inline: 16px; }
  .topbar .wrap { flex-wrap: wrap; gap: 8px 14px; padding-block: 10px; }
  .nav { order: 3; flex-basis: 100%; }
  .live { margin-left: auto; }
  .live-meta { display: none; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .summary { grid-template-columns: 1fr; }
  .summary > div { border-left: 0 !important; border-top: 1px solid var(--line); }
  .summary > div:first-child { border-top: 0; }
  .rule-grid { grid-template-columns: 1fr; }
  .rule { border-left: 0 !important; border-top: 1px solid var(--line); }
  .rule:first-child { border-top: 0; }
  .site { grid-template-columns: minmax(0, 1fr) auto; }
  .site .since, .site .bytes { display: none; }
  /* node table becomes cards */
  table { min-width: 0; }
  thead { display: none; }
  tbody tr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  tbody tr.group-row { display: block; padding: 0; }
  tbody tr.group-row td { display: block; }
  tbody td { border: 0; padding: 0; text-align: left; white-space: normal; }
  tbody td:first-child { grid-column: 1 / -1; }
  tbody td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); }
  .nm { min-width: 0; }
  tr.is-current { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
  tr.is-current td { background: transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .live-dot::after { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" style="fill:var(--accent-soft);stroke:var(--line)"></rect>
        <path d="M6 20c4 0 5-8 10-8s6 8 10 8" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round"></path>
        <circle cx="16" cy="12" r="2.4" style="fill:var(--accent)"></circle>
      </svg>
      <b>稳航</b><span>SteadyRoute</span>
    </div>
    <nav class="nav" aria-label="页面">
      <a href="/" aria-current="page">看板</a>
      <a href="/nodes">全部节点</a>
      <a href="/guide">使用说明</a>
      <a href="/changelog">更新日志</a>
    </nav>
    <div class="live">
      <span class="live-meta" id="live-meta">正在读取本机状态</span>
      <span class="live-chip" id="live-chip" data-sev="warn"><span class="live-dot"></span><span id="live-title">连接中</span></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="section-head">
    <div>
      <h2>线路</h2>
      <p>台湾只切台湾家宽，香港只切香港家宽</p>
    </div>
    <div class="segmented" role="group" aria-label="曲线时间范围">
      <button type="button" data-range="300" aria-pressed="true">5 分钟</button>
      <button type="button" data-range="900" aria-pressed="false">15 分钟</button>
      <button type="button" data-range="1800" aria-pressed="false">30 分钟</button>
    </div>
  </div>
  <section class="routes" id="routes" aria-live="polite"></section>

  <section class="card summary" aria-label="运行概况">
    <div>
      <span class="s-label">系统状态</span>
      <span class="s-value" id="sys-title">—</span>
      <span class="s-note" id="sys-note">等待首轮数据</span>
    </div>
    <div>
      <span class="s-label">节点 <button class="tip" type="button" data-tip="lifecycle" aria-label="说明：节点状态">?</button></span>
      <div class="stack" id="node-stack"></div>
      <div class="stack-legend" id="node-stack-legend"></div>
    </div>
    <div>
      <span class="s-label">内存占用 <button class="tip" type="button" data-tip="memory" aria-label="说明：内存占用">?</button></span>
      <span class="s-value" id="mem-value">—</span>
      <span class="s-note" id="mem-note">当前进程生命周期</span>
    </div>
    <div>
      <span class="s-label">累计检测</span>
      <span class="s-value" id="cycles">—</span>
      <span class="s-note" id="cycles-note">每 20 秒一轮完整检测</span>
    </div>
  </section>

  <section class="card" aria-label="节点状态">
    <div class="nodes-head">
      <div>
        <h2>节点状态</h2>
        <p id="node-summary">按地区分组，当前线路和热备排在最前</p>
      </div>
      <div class="filters" role="group" aria-label="节点筛选">
        <button class="filter active" data-filter="focus" type="button" aria-pressed="true" title="当前线路、热备和异常节点">需关注<span class="count" data-count="focus"></span></button>
        <button class="filter" data-filter="all" type="button" aria-pressed="false">全部<span class="count" data-count="all"></span></button>
        <button class="filter" data-filter="tw" type="button" aria-pressed="false">台湾<span class="count" data-count="tw"></span></button>
        <button class="filter" data-filter="hk" type="button" aria-pressed="false">香港<span class="count" data-count="hk"></span></button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>节点</th>
            <th><span class="th">近 24 小时可用率 <button class="tip" type="button" data-tip="availability" aria-label="说明：近 24 小时可用率">?</button></span></th>
            <th><span class="th">平均延迟 <button class="tip" type="button" data-tip="latency" aria-label="说明：平均延迟">?</button></span></th>
            <th><span class="th">抖动 <button class="tip" type="button" data-tip="jitter" aria-label="说明：抖动">?</button></span></th>
            <th><span class="th">综合评分 <button class="tip" type="button" data-tip="quality" aria-label="说明：综合评分">?</button></span></th>
            <th><span class="th">状态 <button class="tip" type="button" data-tip="lifecycle" aria-label="说明：节点状态">?</button></span></th>
            <th><span class="th">连续 <button class="tip" type="button" data-tip="streak" aria-label="说明：连续次数">?</button></span></th>
          </tr>
        </thead>
        <tbody id="node-rows"></tbody>
      </table>
    </div>
  </section>

  <details class="card rules" id="rules">
    <summary><h2>选路规则</h2><span class="chev">展开 / 收起</span></summary>
    <div class="rule-grid" id="rule-grid"></div>
  </details>
</main>

<footer class="wrap" id="footer">仅监听本机 127.0.0.1 · 页面每 2 秒刷新 · Mac 睡眠时暂停</footer>

<div id="tip-pop" role="tooltip" hidden></div>

<script>
'use strict';

/* ====================================================================
   Helpers
   ==================================================================== */
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowSeconds = () => Date.now() / 1000;
const age = s => s < 2 ? '刚刚' : s < 120 ? `${s}秒前` : `${Math.floor(s / 60)}分钟前`;
const duration = s => s < 60 ? `${Math.round(s)} 秒` : s < 3600 ? `${Math.round(s / 60)} 分钟` : `${(s / 3600).toFixed(1)} 小时`;
const clock = (t, withSeconds) => {
  const d = new Date(t * 1000), p = n => String(n).padStart(2, '0');
  return withSeconds ? `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` : `${p(d.getHours())}:${p(d.getMinutes())}`;
};
const bytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : n < 1073741824 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`;
const pct = v => v == null ? '—' : `${Math.round(v * 100)}%`;
const ms = v => v == null ? '—' : `${Math.round(v)} ms`;
const sevClass = severity => severity === 'critical' ? 'bad' : severity === 'warning' ? 'warn' : severity === 'info' ? 'info' : 'good';
const regionName = code => code === 'TW' ? '台湾' : code === 'HK' ? '香港' : '其他';
const shorten = (text, n) => { const s = [...String(text || '')]; return s.length > n ? s.slice(0, n - 1).join('') + '…' : s.join(''); };
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Only touch the DOM when the markup actually changed: no flicker, no lost selection. */
function patch(el, html) {
  if (el && el.__html !== html) { el.innerHTML = html; el.__html = html; }
}
function setText(el, text) {
  if (el && el.textContent !== text) el.textContent = text;
}

/* ====================================================================
   State
   ==================================================================== */
let snapshot = null;
let activeFilter = 'focus';
let rangeSeconds = 300;
const openConnections = new Set();
const charts = new Map();      // group name -> chart (see the chart section)

/* ====================================================================
   Explanations for the "?" buttons. Each returns {title, text, value}.
   ==================================================================== */
const TIPS = {
  availability: (ctx) => ({
    title: '近 24 小时可用率',
    text: '最近 24 小时里探测成功的比例。100% 表示这段时间每次探测都成功；低于 90% 的节点不会被主动换上。',
    value: ctx && ctx.node ? `当前 ${pct(ctx.node.long_availability ?? ctx.node.availability)}` : null,
    anchor: 'metrics',
  }),
  latency: (ctx) => ({
    title: '平均延迟',
    text: '最近几次探测的平均响应时间，越新的探测权重越大，所以变快、变慢都能很快反映出来。越低越好。',
    value: ctx && ctx.node ? `当前 ${ms(ctx.node.latency)}` : null,
    anchor: 'metrics',
  }),
  jitter: (ctx) => ({
    title: '抖动',
    text: '延迟忽高忽低的幅度。抖动大的节点即使平均延迟低，用起来也可能卡顿。越低越好。',
    value: ctx && ctx.node ? `当前 ${ms(ctx.node.jitter)}` : null,
    anchor: 'metrics',
  }),
  quality: (ctx) => ({
    title: '综合评分',
    text: '0～100 分，由可用率（占 65%）、延迟（25%）、抖动（10%）算出，样本少时会打折。只用于展示；选路时直接比较延迟、抖动和可用率，不看这个分。',
    value: ctx && ctx.node && ctx.node.quality != null ? `当前 ${ctx.node.quality}/100` : null,
    anchor: 'metrics',
  }),
  connections: (ctx) => ({
    title: '活跃连接',
    text: '当前经过这条线路的连接数，点击查看是哪些网站。主动换到更快的节点时旧连接不会断开，会留在原节点直到自然结束。',
    value: ctx && ctx.group ? `当前 ${ctx.group.active_connections} 个` : null,
    anchor: 'connections',
  }),
  chart: () => ({
    title: '实时延迟曲线',
    text: '实线是当前节点，每 5 秒测一次；虚线是热备，每 20 秒测一次。两者用同一种轻量探测（不含加密握手），所以数值通常比上方“平均延迟”低，适合看变化和对比两条线。红块是当前节点探测失败，空心圈是热备探测失败。红色实线是故障切换（会断开旧节点上的连接），绿色虚线是无损回优（旧连接保留）。鼠标移上去（手机上点一下）看具体数值。',
    value: null,
    anchor: 'chart',
  }),
  standby: (ctx) => ({
    title: '热备节点',
    text: '当前节点一旦确认故障，会立刻切到它。它和当前节点在同一地区，图中虚线是它的实时延迟（每 20 秒测一次）。',
    value: null,
    anchor: 'failover',
  }),
  lifecycle: () => ({
    title: '节点状态',
    text: '稳定：可参与选路。观察中：新节点在积累样本，或隔离期满正在试探。下降：最近有失败。已隔离：10 分钟内失败 3 次，暂停 30 分钟。不会被选中的节点永远不影响当前线路。',
    value: null,
    anchor: 'lifecycle',
  }),
  streak: () => ({
    title: '连续次数',
    text: '最近一次探测成功时，显示连续成功了多少次；失败时显示连续失败多少次（红色）。',
    value: null,
    anchor: 'metrics',
  }),
  memory: (ctx) => ({
    title: '内存占用',
    text: '大字是此刻实际占用，与活动监视器“内存”列同口径，会上下浮动。峰值是本次启动以来的最高值，只升不降，重启后清零。判断是否泄漏看长期趋势，不看峰值。',
    value: ctx && ctx.service && ctx.service.memory_current_mb != null
      ? `当前 ${ctx.service.memory_current_mb.toFixed(1)} MB · 峰值 ${(ctx.service.memory_peak_mb ?? ctx.service.memory_mb).toFixed(1)} MB`
      : null,
    anchor: 'memory',
  }),
};

/* ====================================================================
   Top bar
   ==================================================================== */
function memText(s) {
  const cur = s.memory_current_mb, peak = s.memory_peak_mb ?? s.memory_mb;
  return cur == null ? `峰值内存 ${peak.toFixed(1)} MB` : `内存 ${cur.toFixed(1)} MB（峰值 ${peak.toFixed(1)} MB）`;
}

function renderTopbar(d) {
  const now = nowSeconds(), s = d.service;
  const seen = s.last_probe_at ?? s.updated_at;
  const a = seen == null ? null : Math.max(0, Math.round(now - seen));
  const stale = s.stale_at != null && now >= s.stale_at;
  const title = stale ? s.stale_title : s.state_title;
  const severity = stale ? 'warning' : s.state_severity;
  const chip = $('#live-chip');
  chip.dataset.sev = severity === 'ok' ? 'ok' : severity === 'critical' ? 'bad' : 'warn';
  chip.title = stale ? s.stale_detail : s.state_detail;
  setText($('#live-title'), title);
  setText($('#live-meta'), a == null ? s.state_detail : `最近检测 ${age(a)}${s.version ? ' · v' + s.version : ''}`);
}

/* ====================================================================
   Route cards
   ==================================================================== */
function routeSkeleton(g) {
  const key = esc(g.name);
  return `<article class="card route" data-group="${key}">
    <div class="route-top">
      <div class="route-title">
        <span class="region"><i></i><span data-f="region"></span></span>
        <h2>${key}</h2>
      </div>
      <span class="pill" data-f="decision"></span>
    </div>
    <div class="now">
      <span class="now-label">当前节点</span>
      <span class="now-name" data-f="current"></span>
      <span class="now-standby" data-f="standby"></span>
    </div>
    <div class="metrics">
      <div class="metric"><span class="m-label">近 24 小时可用率 <button class="tip" type="button" data-tip="availability" aria-label="说明：近 24 小时可用率">?</button></span><span class="m-value" data-f="availability">—</span></div>
      <div class="metric"><span class="m-label">平均延迟 <button class="tip" type="button" data-tip="latency" aria-label="说明：平均延迟">?</button></span><span class="m-value" data-f="latency">—</span></div>
      <div class="metric"><span class="m-label">综合评分 <button class="tip" type="button" data-tip="quality" aria-label="说明：综合评分">?</button></span><span class="m-value" data-f="quality">—</span></div>
      <div class="metric conn">
        <span class="m-label">活跃连接 <button class="tip" type="button" data-tip="connections" aria-label="说明：活跃连接">?</button></span>
        <button class="m-value m-toggle" type="button" data-f="conn-toggle" aria-expanded="false"><span data-f="connections">—</span></button>
      </div>
    </div>
    <div data-f="handover"></div>
    <div class="chart">
      <div class="chart-head">
        <div class="legend">
          <span><i class="sw"></i>当前节点</span>
          <span><i class="sw standby"></i>热备</span>
          <span><i class="sw fail"></i>探测失败</span>
          <span><i class="sw switch-fail"></i>故障切换</span>
          <span><i class="sw switch-opt"></i>回优</span>
        </div>
        <span class="chart-now"><span data-f="last"></span> <button class="tip" type="button" data-tip="chart" aria-label="说明：实时延迟曲线">?</button></span>
      </div>
      <div class="plot" data-f="plot"></div>
    </div>
    <p class="reason" data-f="reason"></p>
    <div class="conns" data-f="conns" hidden></div>
  </article>`;
}

function ensureRoutes(d) {
  const box = $('#routes');
  const names = d.groups.map(g => g.name).join('|');
  if (box.__names !== names) {
    box.innerHTML = d.groups.map(routeSkeleton).join('');
    box.__names = names;
    charts.clear();
    $$('.route', box).forEach(card => {
      const group = card.dataset.group;
      const toggle = $('[data-f="conn-toggle"]', card);
      toggle.addEventListener('click', () => {
        if (openConnections.has(group)) openConnections.delete(group); else openConnections.add(group);
        if (snapshot) renderRoutes(snapshot);
      });
      charts.set(group, makeChart(card.querySelector('[data-f="plot"]')));
    });
  }
  return box;
}

function renderRoutes(d) {
  const box = ensureRoutes(d);
  d.groups.forEach(g => {
    const card = box.querySelector(`.route[data-group="${CSS.escape(g.name)}"]`);
    if (!card) return;
    const f = name => card.querySelector(`[data-f="${name}"]`);
    const node = d.nodes[g.current] || {};
    const standby = g.hot_standby ? d.nodes[g.hot_standby] : null;

    setText(f('region'), `${regionName(g.region)} · ${g.region === 'TW' ? 'AI 出口' : '备援出口'}`);
    const pill = f('decision');
    pill.className = `pill ${sevClass(g.decision_severity)}`;
    setText(pill, g.decision);
    pill.title = g.decision;
    setText(f('current'), g.current || '等待 Clash');
    patch(f('standby'), g.hot_standby
      ? `<i class="dash" aria-hidden="true"></i>热备 <b>${esc(g.hot_standby)}</b>${standby && standby.latency != null ? ` · ${ms(standby.latency)}` : ''}
         <button class="tip" type="button" data-tip="standby" aria-label="说明：热备节点">?</button>`
      : '暂无成熟热备 · 故障时将保持当前选择并继续检测');

    patch(f('availability'), esc(pct(node.long_availability ?? node.availability)));
    patch(f('latency'), node.latency == null ? '—' : `${Math.round(node.latency)}<small>ms</small>`);
    patch(f('quality'), node.quality == null ? '—' : `${node.quality}<small>/100</small>`);
    const conns = g.connections || { total: g.active_connections, by_node: {}, sites: [] };
    const open = openConnections.has(g.name);
    patch(f('connections'), `${g.active_connections}<small>${open ? '收起' : '查看'}</small>`);
    f('conn-toggle').setAttribute('aria-expanded', String(open));

    patch(f('handover'), handoverHtml(g, conns));

    const next = g.next_action && g.next_action !== g.decision_detail ? ` <span class="next">下一步：${esc(g.next_action)}</span>` : '';
    patch(f('reason'), esc(g.decision_detail || g.decision) + next);

    const panel = f('conns');
    panel.hidden = !open;
    if (open) patch(panel, connectionsHtml(g, conns));
    const chart = charts.get(g.name);
    if (chart) chart.setData(g, card);
  });
}

/* ====================================================================
   Handover: an optimize keeps old connections on the old node until they end
   ==================================================================== */
function oldNodes(g, conns) {
  return Object.entries(conns.by_node || {}).filter(([name, count]) => name && name !== g.current && count > 0);
}

function handoverHtml(g, conns) {
  const olds = oldNodes(g, conns);
  if (!olds.length) return '';
  const total = Math.max(1, conns.total || 0);
  const onOld = olds.reduce((s, [, c]) => s + c, 0);
  const onNew = (conns.by_node || {})[g.current] || 0;
  const since = g.last_switch_at ? Math.max(0, nowSeconds() - g.last_switch_at) : null;
  return `<div class="handover" role="status">
    <div class="handover-title"><span>交接中 · 旧连接不中断</span><span>${since != null ? '切换后 ' + duration(since) : ''}</span></div>
    <div class="split" aria-hidden="true"><i style="width:${(onOld / total * 100).toFixed(1)}%;background:var(--standby)"></i><i style="width:${(onNew / total * 100).toFixed(1)}%;background:var(--accent)"></i></div>
    <div>旧节点 <b>${esc(shorten(olds[0][0], 18))}</b> 仍有 <b>${onOld}</b> 个连接，新请求已走 <b>${esc(shorten(g.current, 18))}</b>（${onNew} 个）。旧连接会自然结束，不会被主动断开。</div>
  </div>`;
}

/* ====================================================================
   Active connections
   ==================================================================== */
function connectionsHtml(g, c) {
  const now = nowSeconds();
  const nodes = Object.entries(c.by_node || {}).sort((a, b) => b[1] - a[1]);
  const total = c.total || 0;
  const colorFor = name => name === g.current ? 'var(--accent)' : 'var(--standby)';
  const split = nodes.map(([name, count]) => `<i style="width:${(count / Math.max(1, total) * 100).toFixed(1)}%;background:${colorFor(name)}"></i>`).join('');
  const legend = nodes.map(([name, count]) => `<span><em style="background:${colorFor(name)}"></em>${esc(name)} · ${count} 个${name === g.current ? '' : '（旧节点，保留到自然结束）'}</span>`).join('');
  const sites = (c.sites || []).map(site => {
    const onOld = Object.entries(site.nodes || {}).filter(([name]) => name !== g.current).reduce((sum, [, n]) => sum + n, 0);
    return `<div class="site">
      <span class="site-host"><b>${esc(site.host)}</b><small>${esc(site.process || '未知应用')}${onOld ? ` · <span class="old">${onOld} 个在旧节点</span>` : ''}</small></span>
      <span class="since">${site.since ? '已 ' + duration(Math.max(0, now - site.since)) : ''}</span>
      <span class="bytes">↓ ${bytes(site.download || 0)} · ↑ ${bytes(site.upload || 0)}</span>
      <span class="count">${site.count}</span>
    </div>`;
  }).join('');
  const observed = c.observed_at ? `约 ${Math.max(0, Math.round(now - c.observed_at))} 秒前更新` : '';
  return `<div class="conns-head"><span>${total} 个连接 · ${(c.sites || []).length + (c.more_sites || 0)} 个网站</span><span>${observed}</span></div>
    ${total ? `<div class="split">${split}</div><div class="split-legend">${legend}</div>` : ''}
    ${sites ? `<div class="site-list">${sites}</div>` : '<p class="conns-note">当前没有经过这条线路的连接。</p>'}
    ${c.more_sites ? `<p class="conns-note">另有 ${c.more_sites} 个网站未列出。</p>` : ''}
    <p class="conns-note">只显示网站域名，不显示 IP 和完整网址；只在本机页面显示，不保存。每 20 秒随完整检测更新。</p>`;
}

/* ====================================================================
   Latency chart
   ==================================================================== */
/* Switch markers: colour, line style and words all differ, so no one relies on colour alone. */
const SWITCH_KINDS = {
  failover: { label: '故障切换', color: 'var(--bad)', dash: false },
  optimize: { label: '回优', color: 'var(--good)', dash: true },
  removed: { label: '节点被移除', color: 'var(--warn)', dash: true },
};

function niceMax(v) {
  const steps = [50, 80, 100, 150, 200, 300, 400, 500, 800, 1000, 1500, 2000, 3000];
  return steps.find(s => s >= v) || Math.ceil(v / 1000) * 1000;
}

function nearest(points, t, within) {
  let best = null;
  (points || []).forEach(p => { if (Math.abs(p[0] - t) <= within && (!best || Math.abs(p[0] - t) < Math.abs(best[0] - t))) best = p; });
  return best;
}

let chartSeq = 0;
function makeChart(plot) {
  const L = 50, R = 12, T = 14, B = 24;
  const id = `c${++chartSeq}`;
  const st = { points: null, dataKey: '', top: 100, targetTop: 100, w: 0, h: 0, drawnKey: '', base: null, hoverX: null, pinned: false };
  plot.innerHTML = `<svg role="img" aria-label="实时延迟曲线"><defs>
      <clipPath id="clip-${id}"><rect></rect></clipPath>
      <linearGradient id="grad-${id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" style="stop-color:var(--accent)" stop-opacity=".22"></stop>
        <stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"></stop>
      </linearGradient></defs>
      <g class="yaxis"></g>
      <g clip-path="url(#clip-${id})"><g class="slide"></g><g class="hover"></g></g>
    </svg><div class="plot-tip" hidden></div><div class="empty">等待第一批探测数据…</div>`;
  const svg = plot.querySelector('svg'), yaxis = svg.querySelector('.yaxis'), slide = svg.querySelector('.slide');
  const hoverG = svg.querySelector('.hover'), clip = svg.querySelector('clipPath rect'), tip = plot.querySelector('.plot-tip');
  const empty = plot.querySelector('.empty');

  function geometry() {
    const w = Math.max(240, plot.clientWidth || 600), h = plot.clientHeight || 212;
    if (w !== st.w || h !== st.h) {
      st.w = w; st.h = h; st.drawnKey = '';
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      clip.setAttribute('x', L); clip.setAttribute('y', 0); clip.setAttribute('width', w - L - R); clip.setAttribute('height', h);
    }
    return { w, h, iw: w - L - R, ih: h - T - B };
  }

  function draw() {
    const pts = st.points || [];
    const { w, iw, ih } = geometry();
    const pps = iw / rangeSeconds;                       // pixels per second
    const base = st.base = nowSeconds();                  // time at the right edge when drawn
    const X = t => L + iw - (base - t) * pps;
    const top = st.top;
    const Y = v => T + ih - Math.min(v, top) / top * ih;
    const probes = pts.filter(p => p[2] === 'probe'), standby = pts.filter(p => p[2] === 'standby'), switches = pts.filter(p => p[2] === 'switch');

    let yhtml = '';
    for (let i = 0; i <= 3; i++) {
      const v = top / 3 * i, y = Y(v);
      yhtml += `<line class="grid" x1="${L}" x2="${w - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"></line>`;
      yhtml += `<text class="axis" x="${L - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${Math.round(v)}${i === 3 ? ' ms' : ''}</text>`;
    }
    yaxis.innerHTML = yhtml;

    const line = (points, bridge) => {
      let path = '', pen = false;
      (bridge ? points.filter(p => p[1] != null) : points).forEach(p => {
        if (p[1] == null) { pen = false; return; }
        path += `${pen ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`; pen = true;
      });
      return path;
    };
    const area = points => {
      let out = '', run = [];
      const flush = () => {
        if (run.length > 1) out += `M${X(run[0][0]).toFixed(1)},${(T + ih).toFixed(1)}` + run.map(p => `L${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('') + `L${X(run[run.length - 1][0]).toFixed(1)},${(T + ih).toFixed(1)}Z`;
        run = [];
      };
      points.forEach(p => { if (p[1] == null) flush(); else run.push(p); });
      flush();
      return out;
    };
    const tickEvery = rangeSeconds <= 300 ? 60 : rangeSeconds <= 900 ? 180 : 300;
    let ticks = '';
    for (let t = Math.ceil((base - rangeSeconds - 120) / tickEvery) * tickEvery; t <= base + 120; t += tickEvery) {
      ticks += `<text class="axis" x="${X(t).toFixed(1)}" y="${T + ih + 16}" text-anchor="middle">${clock(t)}</text>`;
    }
    const fails = probes.filter(p => p[1] == null).map(p => `<rect x="${(X(p[0]) - 2.5).toFixed(1)}" y="${(T + ih - 9).toFixed(1)}" width="5" height="9" rx="1.5" style="fill:var(--bad)"></rect>`).join('');
    const sbFails = standby.filter(p => p[1] == null).map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${(T + ih - 4).toFixed(1)}" r="3" fill="none" style="stroke:var(--standby)" stroke-width="1.5"></circle>`).join('');
    const sw = switches.map(p => {
      const x = X(p[0]), k = SWITCH_KINDS[p[4]] || SWITCH_KINDS.optimize;
      return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T}" y2="${T + ih}" style="stroke:${k.color}" stroke-width="${k.dash ? 1.6 : 2}"${k.dash ? ' stroke-dasharray="4 3"' : ''}></line>
        <text class="flag" x="${(x - 5).toFixed(1)}" y="${T + 10}" text-anchor="end" style="fill:${k.color}">${k.label} → ${esc(shorten(p[3], 12))}</text>`;
    }).join('');
    const last = probes[probes.length - 1];
    const lastDot = last && last[1] != null ? `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" style="fill:var(--accent)"></circle>` : '';
    slide.innerHTML = `${ticks}
      <path d="${area(probes)}" fill="url(#grad-${id})"></path>
      <path d="${line(standby, true)}" fill="none" style="stroke:var(--standby)" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"></path>
      <path d="${line(probes)}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
      ${sw}${fails}${sbFails}${lastDot}`;
    Object.assign(st, { pps, X, Y, probes, standby, switches });
    empty.hidden = probes.length > 0;
  }

  function drawHover(dx) {
    if (st.hoverX == null || !st.probes || !st.probes.length) {
      if (hoverG.innerHTML) hoverG.innerHTML = '';
      tip.hidden = true;
      return;
    }
    const t = st.base - (L + (st.w - L - R) - (st.hoverX - dx)) / st.pps;
    const p = nearest(st.probes, t, Math.max(6, 8 / st.pps));
    if (!p) { hoverG.innerHTML = ''; tip.hidden = true; return; }
    const x = st.X(p[0]) + dx;
    hoverG.innerHTML = `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T}" y2="${st.h - B}" style="stroke:var(--line-strong)"></line>` +
      (p[1] != null ? `<circle cx="${x.toFixed(1)}" cy="${st.Y(p[1]).toFixed(1)}" r="4" stroke-width="2" style="fill:var(--surface);stroke:var(--accent)"></circle>` : '');
    const sb = nearest(st.standby, p[0], 25), sw = nearest(st.switches, p[0], 8);
    const k = sw ? SWITCH_KINDS[sw[4]] || SWITCH_KINDS.optimize : null;
    const html = `<div class="t">${clock(p[0], true)}</div>
      <div class="row"><span>当前</span><b>${p[1] == null ? '<span style="color:var(--bad)">失败</span>' : p[1] + ' ms'}</b></div>
      ${sb ? `<div class="row"><span>热备</span><b>${sb[1] == null ? '失败' : sb[1] + ' ms'}</b></div>` : ''}
      <div class="t" style="margin-top:3px">${esc(p[3] || '')}</div>
      ${k ? `<div class="row" style="margin-top:4px;color:${k.color}"><span>${k.label}</span><b>${clock(sw[0], true)}</b></div><div class="t">→ ${esc(sw[3] || '')}</div>` : ''}`;
    if (tip.__html !== html) { tip.innerHTML = html; tip.__html = html; }
    tip.hidden = false;
    const tw = tip.offsetWidth || 170;
    tip.style.left = `${x + 14 + tw > st.w - 4 ? Math.max(4, x - tw - 14) : x + 14}px`;
    tip.style.top = '10px';
  }

  function frame() {
    if (!st.points) return;
    geometry();
    // Ease the vertical scale towards its target instead of jumping.
    if (Math.abs(st.top - st.targetTop) > 0.5 && !reduceMotion) st.top += (st.targetTop - st.top) * 0.18;
    else st.top = st.targetTop;
    const now = nowSeconds();
    const key = `${st.dataKey}|${Math.round(st.top)}|${rangeSeconds}|${st.w}|${st.h}`;
    if (key !== st.drawnKey || st.base == null || now - st.base > 30 || now < st.base) { draw(); st.drawnKey = key; }
    const dx = -(now - st.base) * st.pps;
    slide.setAttribute('transform', `translate(${reduceMotion ? Math.round(dx) : dx.toFixed(2)},0)`);
    drawHover(dx);
  }

  const move = event => {
    const rect = plot.getBoundingClientRect();
    st.hoverX = event.clientX - rect.left;
    st.pinned = event.pointerType !== 'mouse';
  };
  plot.addEventListener('pointermove', move);
  plot.addEventListener('pointerdown', move);
  plot.addEventListener('pointerleave', event => { if (event.pointerType === 'mouse') st.hoverX = null; });

  return {
    st,
    frame,
    reset() { st.dataKey = ''; st.drawnKey = ''; st.base = null; },
    clearPinned() { if (st.pinned) { st.hoverX = null; st.pinned = false; } },
    setData(g, card) {
      const from = nowSeconds() - rangeSeconds - 30;
      const pts = (g.timeline || []).filter(p => p[0] >= from);
      const key = pts.length ? `${pts.length}:${pts[pts.length - 1][0]}:${pts[0][0]}` : 'none';
      if (key === st.dataKey) return;
      st.dataKey = key;
      st.points = pts;
      const values = pts.filter(p => p[2] !== 'switch').map(p => p[1]).filter(v => v != null);
      st.targetTop = niceMax(Math.max(40, ...values) * 1.15);
      if (st.base == null) st.top = st.targetTop;
      const last = pts.filter(p => p[2] === 'probe').pop();
      patch(card.querySelector('[data-f="last"]'), !last ? '' : last[1] == null ? '最新 <b style="color:var(--bad)">失败</b>' : `最新 <b>${last[1]}</b> ms`);
    },
  };
}

function animate() {
  charts.forEach(chart => chart.frame());
  requestAnimationFrame(animate);
}

/* ====================================================================
   Summary strip
   ==================================================================== */
function resumeNote(s) {
  if (!s.last_resume_at) return '';
  const m = Math.max(1, Math.round((s.last_sleep_gap_seconds || 0) / 60));
  return ` · 上次休眠恢复 ${clock(s.last_resume_at)}（休眠约 ${m} 分钟）`;
}

function renderSummary(d) {
  const s = d.service;
  setText($('#sys-title'), s.state_title);
  setText($('#sys-note'), s.state_detail + resumeNote(s));

  const nodes = Object.values(d.nodes);
  const count = codes => nodes.filter(n => codes.includes(n.lifecycle)).length;
  const healthy = count(['healthy']);
  const watching = count(['discovered', 'warming', 'half_open']);
  const down = count(['degraded', 'quarantined', 'retired']);
  const total = Math.max(1, nodes.length);
  patch($('#node-stack'), `<i style="width:${healthy / total * 100}%;background:var(--good)"></i><i style="width:${watching / total * 100}%;background:var(--standby)"></i><i style="width:${down / total * 100}%;background:var(--bad)"></i>`);
  patch($('#node-stack-legend'), `<span><b>${healthy}</b> 稳定</span><span><b>${watching}</b> 观察中</span><span><b>${down}</b> 不可用</span>`);

  const cur = s.memory_current_mb, peak = s.memory_peak_mb ?? s.memory_mb;
  patch($('#mem-value'), `${(cur ?? peak).toFixed(1)}<small>MB</small>`);
  setText($('#mem-note'), cur == null ? '峰值 · 当前进程生命周期' : `峰值 ${peak.toFixed(1)} MB · 当前进程生命周期`);

  patch($('#cycles'), `${(s.cycle_count || 0).toLocaleString('zh-CN')}<small>轮</small>`);
  setText($('#cycles-note'), `每 ${s.probe_interval_seconds} 秒一轮完整检测 · 当前线路每 ${s.fast_probe_interval_seconds || 5} 秒`);
}

/* ====================================================================
   Node table
   ==================================================================== */
function allRows(d) {
  const current = new Set(d.groups.map(g => g.current));
  const standby = new Set(d.groups.map(g => g.hot_standby).filter(Boolean));
  const regions = new Map();
  d.groups.forEach(g => (g.candidates || []).forEach(n => regions.set(n, regionName(g.region))));
  const rank = r => r.current ? 0 : r.standby ? 1 : r.cls === 'bad' ? 2 : r.cls === 'warn' ? 3 : 4;
  const regionRank = name => name === '台湾' ? 0 : name === '香港' ? 1 : 2;
  return Object.entries(d.nodes)
    .map(([name, node]) => ({ name, node, region: regions.get(name) || '其他', current: current.has(name), standby: standby.has(name), cls: sevClass(node.lifecycle_severity) }))
    .sort((a, b) => regionRank(a.region) - regionRank(b.region) || rank(a) - rank(b) || (b.node.quality ?? -1) - (a.node.quality ?? -1));
}

function matches(r) {
  return activeFilter === 'all'
    || activeFilter === 'tw' && r.region === '台湾'
    || activeFilter === 'hk' && r.region === '香港'
    || activeFilter === 'focus' && (r.current || r.standby || r.cls !== 'good');
}

function rowHtml(r, d) {
  const n = r.node;
  const a = n.long_availability ?? n.availability;
  const aw = a == null ? 0 : Math.round(a * 100);
  const barCls = a == null ? '' : a >= 0.95 ? '' : a >= 0.8 ? 'warn' : 'bad';
  const q = n.quality, qCls = q == null ? '' : q < 40 ? 'bad' : q < 70 ? 'warn' : '';
  const streak = n.last_success ? `成功 ${n.success_streak}` : `<span style="color:var(--bad)">失败 ${n.failure_streak}</span>`;
  const sampling = n.lifecycle === 'warming' ? ` · 采样 ${n.samples}/${d.policy.min_samples}` : '';
  const tags = (r.current ? '<span class="tag cur">当前</span>' : '') + (r.standby ? '<span class="tag hot">热备</span>' : '');
  return `<td><div class="nm"><span class="dot ${r.cls === 'good' ? '' : r.cls}"></span><span class="nm-copy"><b>${esc(r.name)}${tags}</b><small>${esc(n.lifecycle_title || '')}${sampling}</small></span></div></td>
    <td data-label="可用率"><span class="avail">${pct(a)}<span class="bar"><i class="${barCls}" style="width:${aw}%"></i></span></span></td>
    <td data-label="平均延迟">${ms(n.latency)}</td>
    <td data-label="抖动">${ms(n.jitter)}</td>
    <td data-label="综合评分"><span class="q ${qCls}">${q == null ? '—' : q + '/100'}</span></td>
    <td data-label="状态"><span class="state ${r.cls === 'good' ? '' : r.cls}" title="${esc(n.lifecycle_detail || '')}">${esc(n.lifecycle_title || '未知')}</span></td>
    <td data-label="连续">${streak}</td>`;
}

function renderNodes(d) {
  const all = allRows(d);
  const saved = activeFilter;
  ['focus', 'all', 'tw', 'hk'].forEach(key => { activeFilter = key; setText($(`[data-count="${key}"]`), String(all.filter(matches).length)); });
  activeFilter = saved;
  const rows = all.filter(matches);
  const body = $('#node-rows');
  if (!body.__rows) body.__rows = new Map();
  const map = body.__rows;
  const ordered = [];
  if (!rows.length) {
    ordered.push(['__empty', '', '<td class="empty-row" colspan="7">没有符合筛选条件的节点</td>']);
  } else {
    let region = null;
    rows.forEach(r => {
      if (r.region !== region) {
        region = r.region;
        const inRegion = all.filter(x => x.region === region);
        const healthy = inRegion.filter(x => x.cls === 'good').length;
        ordered.push([`__hdr_${region}`, 'group-row', `<td colspan="7">${esc(region)}<span>${inRegion.length} 个节点 · ${healthy} 个稳定${inRegion.length - healthy ? ` · ${inRegion.length - healthy} 个需留意` : ''}</span></td>`]);
      }
      ordered.push([r.name, r.current ? 'is-current' : '', rowHtml(r, d)]);
    });
  }
  const wanted = new Set(ordered.map(item => item[0]));
  for (const [key, tr] of map) if (!wanted.has(key)) { tr.remove(); map.delete(key); }
  ordered.forEach(([key, cls, html], index) => {
    let tr = map.get(key);
    if (!tr) { tr = document.createElement('tr'); map.set(key, tr); }
    if (tr.className !== cls) tr.className = cls;
    patch(tr, html);
    if (body.children[index] !== tr) body.insertBefore(tr, body.children[index] || null);
  });
  setText($('#node-summary'), `累计检测 ${(d.service.cycle_count || 0).toLocaleString('zh-CN')} 轮 · 显示 ${rows.length}/${all.length} 个节点 · 按地区分组，当前和热备在前`);
}

/* ====================================================================
   Rules, in plain words with live numbers
   ==================================================================== */
function renderRules(d) {
  const p = d.policy, s = d.service;
  const fast = s.fast_probe_interval_seconds || s.probe_interval_seconds;
  const confirm = p.confirm_probes ? `${p.confirm_probes} 次连续失败` : `${p.failures_before_switch} 轮失败`;
  const items = [
    ['1', '怎么检测', `当前线路每 ${fast} 秒测一次；每 ${s.probe_interval_seconds} 秒一轮完整检测，同时测热备和轮询备用节点；每 ${p.business_probe_interval_seconds} 秒测一次 AI 网站能否打开。`,
      [['当前线路', `${fast} 秒`], ['完整检测', `${s.probe_interval_seconds} 秒`], ['AI 网站', `${p.business_probe_interval_seconds} 秒`]], 'detection'],
    ['2', '什么时候判定故障', `当前节点探测失败后，同一轮内马上再测 2 次，并检查本机网络。${confirm}才判定故障，立刻切到同地区热备，只断开旧节点上的连接。本机断网或刚从休眠醒来时不判定。`,
      [['确认', confirm], ['切换目标', '同地区热备']], 'failover'],
    ['3', '什么时候换更快的', `节点没坏、只是有更快的时，要求至少快 ${p.absolute_gain_ms} ms 且快 ${Math.round(p.relative_gain * 100)}%，连续 ${p.confirmations} 轮都更快才换；两次之间至少隔 ${Math.round(p.cooldown_seconds / 60)} 分钟。换的时候旧连接不断，新请求走新节点。`,
      [['最少快', `${p.absolute_gain_ms} ms 且 ${Math.round(p.relative_gain * 100)}%`], ['确认', `${p.confirmations} 轮`], ['冷却', `${Math.round(p.cooldown_seconds / 60)} 分钟`]], 'optimize'],
    ['4', '坏节点怎么处理', `${Math.round(p.quarantine_window_seconds / 60)} 分钟内失败 ${p.quarantine_failures} 次就隔离 ${Math.round(p.quarantine_seconds / 60)} 分钟，期间不会被选中；到期后要连续成功 ${p.quarantine_recovery_successes} 次才恢复。近 24 小时可用率低于 ${Math.round(p.min_availability * 100)}% 的节点不会被主动换上。`,
      [['触发', `${p.quarantine_failures} 次 / ${Math.round(p.quarantine_window_seconds / 60)} 分钟`], ['隔离', `${Math.round(p.quarantine_seconds / 60)} 分钟`], ['恢复', `连续成功 ${p.quarantine_recovery_successes} 次`]], 'quarantine'],
  ];
  patch($('#rule-grid'), items.map(([n, title, text, kv, anchor]) => `<div class="rule">
    <h3><i>${n}</i>${title}</h3>
    <p>${text}</p>
    <ul>${kv.map(([k, v]) => `<li><span>${k}</span><b>${v}</b></li>`).join('')}</ul>
    <a href="/guide#${anchor}">详细说明 →</a>
  </div>`).join(''));
  setText($('#footer'), `仅监听本机 127.0.0.1 · 页面每 2 秒刷新 · Mac 睡眠时暂停${s.version ? ' · 稳航 v' + s.version : ''}`);
}

/* ====================================================================
   Tooltip popover: hover on a mouse, tap on touch, focus on keyboard
   ==================================================================== */
const pop = $('#tip-pop');
let tipOwner = null, tipPinned = false;

function tipContext(button) {
  if (!snapshot) return {};
  const card = button.closest('.route');
  const row = button.closest('tr');
  const ctx = { service: snapshot.service };
  if (card) {
    const g = snapshot.groups.find(item => item.name === card.dataset.group);
    ctx.group = g;
    ctx.node = g ? snapshot.nodes[g.current] : null;
  } else if (row) {
    ctx.node = null;
  }
  return ctx;
}

function openTip(button, pinned) {
  const make = TIPS[button.dataset.tip];
  if (!make) return;
  const t = make(tipContext(button));
  pop.innerHTML = `<h4>${esc(t.title)}</h4><p>${esc(t.text)}</p>${t.value ? `<p class="val">${esc(t.value)}</p>` : ''}<a href="/guide#${t.anchor || ''}">详细说明 →</a>`;
  pop.hidden = false;
  const r = button.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 12);
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
  if (tipOwner && tipOwner !== button) tipOwner.setAttribute('aria-expanded', 'false');
  tipOwner = button;
  tipPinned = pinned;
  button.setAttribute('aria-expanded', 'true');
}
function closeTip() {
  pop.hidden = true;
  if (tipOwner) tipOwner.setAttribute('aria-expanded', 'false');
  tipOwner = null;
  tipPinned = false;
}

document.addEventListener('pointerover', event => {
  const b = event.target.closest('.tip');
  if (b && event.pointerType === 'mouse' && !tipPinned) openTip(b, false);
});
document.addEventListener('pointerout', event => {
  const b = event.target.closest('.tip');
  if (b && event.pointerType === 'mouse' && !tipPinned && !pop.contains(event.relatedTarget)) closeTip();
});
pop.addEventListener('pointerleave', event => { if (event.pointerType === 'mouse' && !tipPinned) closeTip(); });
document.addEventListener('click', event => {
  const b = event.target.closest('.tip');
  if (b) {
    event.preventDefault();
    event.stopPropagation();
    if (tipOwner === b && tipPinned) closeTip(); else openTip(b, true);
    return;
  }
  if (!pop.contains(event.target)) closeTip();
  if (!event.target.closest('.plot')) charts.forEach(chart => chart.clearPinned());
}, true);
document.addEventListener('focusin', event => { const b = event.target.closest && event.target.closest('.tip'); if (b && !tipPinned) openTip(b, false); });
document.addEventListener('focusout', event => { if (event.target.closest && event.target.closest('.tip') && !tipPinned) closeTip(); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeTip();
});
window.addEventListener('scroll', () => { if (!tipPinned) closeTip(); }, { passive: true });

/* ====================================================================
   Controls, polling and render loop
   ==================================================================== */
$$('.filter').forEach(b => b.addEventListener('click', () => {
  activeFilter = b.dataset.filter;
  $$('.filter').forEach(i => { i.classList.toggle('active', i === b); i.setAttribute('aria-pressed', String(i === b)); });
  if (snapshot) renderNodes(snapshot);
}));
function setRange(value) {
  rangeSeconds = value;
  $$('.segmented button').forEach(i => i.setAttribute('aria-pressed', String(Number(i.dataset.range) === value)));
  charts.forEach(chart => chart.reset());
  if (snapshot) renderRoutes(snapshot);
}
$$('.segmented button').forEach(b => b.addEventListener('click', () => {
  setRange(Number(b.dataset.range));
  try { localStorage.setItem('steadyroute.range', String(rangeSeconds)); } catch (e) { /* storage unavailable */ }
}));
try {
  const saved = Number(localStorage.getItem('steadyroute.range'));
  if ([300, 900, 1800].includes(saved)) setRange(saved);
} catch (e) { /* storage unavailable */ }

function render(d) {
  snapshot = d;
  renderTopbar(d);
  renderRoutes(d);
  renderSummary(d);
  renderNodes(d);
  renderRules(d);
  if (tipOwner && !pop.hidden) openTip(tipOwner, tipPinned);
}

async function refresh() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw Error(r.status);
    render(await r.json());
  } catch (e) {
    const chip = $('#live-chip');
    chip.dataset.sev = 'bad';
    setText($('#live-title'), '暂时无法连接');
    setText($('#live-meta'), '请稍后刷新，稳航会自动恢复');
  }
}

refresh();
setInterval(refresh, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(() => { if (snapshot) { renderTopbar(snapshot); renderRoutes(snapshot); } }, 1000);
requestAnimationFrame(animate);
</script>
</body>
</html>
