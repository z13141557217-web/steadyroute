<main class="wrap" style="padding-top:32px"><h1>稳航运行控制</h1><div id="control-mount"></div><p style="max-width:70ch;line-height:1.8">工作进程停止时不再检测节点、自动选路、同步规则或守护修复。轻量控制页面保留，方便手动再启动。原有检测记录保留；停止期间没有新样本，不把旧结果当作当前状态。</p><p>要让控制页面也退出，请使用安装目录中的「停止稳航.command」；之后可用「启动稳航.command」重新打开。</p></main></body></html>
