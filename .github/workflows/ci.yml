name: checks

on:
  push:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' > out.txt 2>&1 || true
      - name: report
        if: always()
        run: |
          python3 - <<'PY'
          import re
          text = open("out.txt", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"={50,}\n((?:FAIL|ERROR): .*?)(?=\n={50,}|\n-{50,}\nRan )", text, re.S)
          for b in blocks[:6]:
              print("::error::" + b[-2500:].replace("%", "%25").replace("\n", "%0A"))
          tail = text[-300:]
          print("::warning::" + tail.replace("%", "%25").replace("\n", "%0A"))
          PY
