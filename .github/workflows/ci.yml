name: checks

on:
  push:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: check
        run: ./scripts/check.sh > check.txt 2>&1; echo "exit=$?" >> check.txt
      - name: report
        if: always()
        run: |
          python3 - <<'PY'
          import re
          text = open("check.txt", encoding="utf-8", errors="replace").read()
          tail = text[-6000:]
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR):)", text)
          bad = [b for b in blocks if re.search(r"^(FAIL|ERROR):", b.lstrip("=\n"), re.M)]
          for b in bad[:8]:
              print("::error::" + b[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          print("::warning::TAIL" + tail[-3500:].replace("%", "%25").replace("\n", "%0A"))
          PY
