name: 功能需求
description: 为稳航增加一个可验收的新能力
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 当前发生了什么，为什么需要解决？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 写明 In Scope 和 Out of Scope。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可测试、可观察的条件。
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险与回滚
      description: 生产风险、状态兼容性与回滚方法。
    validations:
      required: true

